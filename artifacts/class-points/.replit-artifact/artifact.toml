kind = "web"
previewPath = "/"
title = "학급 화폐 & 칭찬 스탬프 통장"
description = "초등학교 교실에서 학생 포인트를 실시간으로 관리하고, 보상 상점과 승인 내역까지 운영하는 교사용 학급 경영 웹앱입니다."
version = "1.0.0"
id = "artifacts/class-points"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24516

[services.development]
run = "pnpm --filter @workspace/class-points run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/class-points", "run", "build" ]
serve = "static"
publicDir = "artifacts/class-points/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24516"
BASE_PATH = "/"
